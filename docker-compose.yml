services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farmos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmos}
      POSTGRES_DB: ${POSTGRES_DB:-farmos}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - farmos_pg:/var/lib/postgresql/data
volumes:
  farmos_pg:
